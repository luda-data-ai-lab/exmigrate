{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Manual</h1>
  <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('static', filename='manual.md') }}" download>Download .md</a>
</div>
<div class="row">
  <nav class="col-md-3 d-none d-md-block">
    <div id="toc" class="position-sticky small" style="top: 1rem"></div>
  </nav>
  <article id="manual" class="col-md-9 manual">
    <p class="text-muted">Loading…</p>
  </article>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script>
(async () => {
  const article = document.getElementById("manual");
  const res = await fetch("{{ url_for('static', filename='manual.md') }}");
  if (!res.ok) {
    article.innerHTML = '<div class="alert alert-danger">manual.md could not be loaded.</div>';
    return;
  }
  const html = marked.parse(await res.text(), { gfm: true });
  article.innerHTML = DOMPurify.sanitize(html);
  article.querySelectorAll("table").forEach((t) => t.classList.add("table", "table-sm", "table-bordered"));
  const toc = document.getElementById("toc");
  const list = document.createElement("ul");
  list.className = "nav flex-column";
  article.querySelectorAll("h2, h3").forEach((h, i) => {
    h.id = h.id || `s-${i}`;
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.className = "nav-link py-0" + (h.tagName === "H3" ? " ps-4 text-muted" : " ps-0");
    a.href = `#${h.id}`;
    a.textContent = h.textContent;
    li.appendChild(a);
    list.appendChild(li);
  });
  toc.appendChild(list);
})();
</script>
{% endblock %}
