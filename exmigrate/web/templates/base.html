<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ExMigrate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='app.css') }}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('pages.upload_page') }}">ExMigrate</a>
    <div class="d-flex align-items-center gap-3">
      <a class="nav-link text-light" href="{{ url_for('pages.upload_page') }}">Upload</a>
      <a class="nav-link text-light" href="{{ url_for('pages.history_page') }}">History</a>
      <a class="nav-link text-light" href="{{ url_for('pages.manual_page') }}">Manual</a>
      <span class="navbar-text small">Excel → SQLite / PostgreSQL</span>
    </div>
  </div>
</nav>
<main class="container pb-5 flex-grow-1">
  {% block content %}{% endblock %}
</main>
<footer class="site-footer border-top py-3 mt-auto">
  <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2 small text-muted">
    <div class="d-flex align-items-center gap-2">
      <img src="{{ url_for('static', filename='luda-logo.png') }}" alt="LUDA" width="36" height="36" class="rounded">
      <div class="lh-sm">
        <div>ExMigrate v{{ app_version }} · Created by <strong>LUDA</strong></div>
        <div class="fst-italic">{{ tagline }}</div>
      </div>
    </div>
    <div class="d-flex align-items-center gap-3">
      <a class="link-secondary" href="mailto:{{ contact_email }}">{{ contact_email }}</a>
      {% if repo_url %}<a class="link-secondary" href="{{ repo_url }}" target="_blank" rel="noopener">GitHub</a>{% endif %}
    </div>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
