openapi: 3.0.3
info:
  title: ExMigrate API
  version: "1.0"
paths:
  /api/upload:
    post:
      summary: Upload one or more .xlsx workbooks and analyze them
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                created_by:
                  type: string
                  maxLength: 80
                  description: Optional operator name recorded on the job (shown in History)
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: { type: string }
                  issues:
                    type: array
                    items: { $ref: "#/components/schemas/Issue" }
        "400": { description: No valid .xlsx files supplied }
  /api/jobs:
    get:
      summary: List all jobs, newest first
      responses:
        "200":
          description: Job summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    job_id: { type: string }
                    state: { type: string, enum: [analyzed, migrating, done, failed] }
                    created_at: { type: string, format: date-time, nullable: true }
                    created_by: { type: string, nullable: true }
                    files: { type: array, items: { type: string } }
                    tables: { type: array, items: { type: string } }
                    targets: { type: array, items: { type: string } }
                    error: { type: string, nullable: true }
  /api/jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    delete:
      summary: Delete a job and all of its files
      responses:
        "204": { description: Deleted }
        "404": { description: Unknown job }
  /api/jobs/{id}/schema:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      summary: Fetch the Schema IR
      responses:
        "200":
          description: Schema IR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchemaIR" }
        "404": { description: Unknown job }
    put:
      summary: Save user edits to the Schema IR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchemaIR" }
      responses:
        "200":
          description: Saved IR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchemaIR" }
        "400": { description: Invalid IR }
        "404": { description: Unknown job }
  /api/jobs/{id}/erd:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      summary: Mermaid erDiagram text for the current Schema IR
      responses:
        "200":
          description: Mermaid source
          content:
            text/plain:
              schema: { type: string }
        "404": { description: Unknown job }
  /api/jobs/{id}/formulas:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      summary: Formula inventory (functions used per workbook column)
      responses:
        "200":
          description: Inventory grouped by uploaded file
          content:
            application/json:
              schema:
                type: object
                properties:
                  functions:
                    type: object
                    additionalProperties: { type: integer }
                    description: Function name → call count across all files
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        file: { type: string }
                        functions:
                          type: object
                          additionalProperties: { type: integer }
                        columns:
                          type: array
                          items: { $ref: "#/components/schemas/FormulaColumn" }
        "404": { description: Unknown job }
  /api/jobs/{id}/lineage:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      summary: Formula data-flow (Lineage IR) at the requested zoom level
      parameters:
        - name: level
          in: query
          required: false
          schema: { type: string, enum: [file, sheet, column, col], default: column }
      responses:
        "200":
          description: Lineage nodes/edges plus a Mermaid flowchart rendering
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineageIR" }
        "400": { description: Invalid level }
        "404": { description: Unknown job }
  /api/jobs/{id}/translation:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      summary: Formula columns translated to SQL views and a pandas script (saved IR)
      parameters:
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, sqlite, postgres, pandas], default: json }
      responses:
        "200":
          description: Translation JSON, or the view SQL / pandas script as text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Translation" }
            text/plain:
              schema: { type: string }
            text/x-python:
              schema: { type: string }
        "400": { description: Invalid format }
        "404": { description: Unknown job }
  /api/jobs/{id}/migrate:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      summary: Run migration to the requested targets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                targets:
                  type: array
                  items:
                    type: string
                    enum: [sqlite, postgres]
                configs:
                  type: object
                  additionalProperties:
                    type: object
                  description: Per-target config, e.g. {"postgres": {"dsn": "...", "mode": "live|dump"}}
      responses:
        "202":
          description: Migration finished; status available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "400": { description: Invalid request }
        "404": { description: Unknown job }
  /api/jobs/{id}/status:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      summary: Job progress and migration report
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "404": { description: Unknown job }
  /api/jobs/{id}/artifacts/{name}:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Download a produced artifact
      responses:
        "200":
          description: File
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: Unknown job or artifact }
components:
  parameters:
    JobId:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    FormulaColumn:
      type: object
      properties:
        file: { type: string }
        sheet: { type: string }
        table: { type: string }
        column: { type: string }
        column_index: { type: integer, nullable: true, description: 0-based position in the table }
        formula_cells: { type: integer }
        row_count: { type: integer }
        derived: { type: boolean }
        functions:
          type: object
          additionalProperties: { type: integer }
          description: Function name (“_xlfn.” prefix stripped) → call count in this column
        references:
          type: array
          items: { type: string }
          description: Sheets referenced by the formulas; external workbooks appear as "[book.xlsx]Sheet"
        sample: { type: string }
    Issue:
      type: object
      required: [severity, code, message]
      properties:
        severity: { type: string, enum: [info, warning, error] }
        code: { type: string }
        message: { type: string }
        table: { type: string, nullable: true }
        column: { type: string, nullable: true }
    ForeignKey:
      type: object
      required: [table, column]
      properties:
        table: { type: string }
        column: { type: string }
        confidence: { type: number }
    Column:
      type: object
      required: [name, source_name, type]
      properties:
        name: { type: string }
        source_name: { type: string }
        type: { type: string, enum: [integer, float, boolean, date, datetime, text] }
        nullable: { type: boolean }
        pk: { type: boolean }
        fk: { $ref: "#/components/schemas/ForeignKey", nullable: true }
        derived: { type: boolean }
        include:
          type: boolean
          default: true
          description: When false the column is omitted from every migration target
        null_ratio: { type: number }
        max_length: { type: integer, nullable: true }
    LineageNode:
      type: object
      required: [id, kind, label, file]
      properties:
        id: { type: string, example: "column:orders.xlsx/Orders/customer_id" }
        kind: { type: string, enum: [file, sheet, column, dynamic_reference] }
        label: { type: string }
        file: { type: string }
        sheet: { type: string, nullable: true }
        column: { type: string, nullable: true }
        missing:
          type: boolean
          description: Referenced workbook was not uploaded
    LineageEdge:
      type: object
      required: [from, to, op]
      properties:
        from: { type: string }
        to: { type: string }
        op: { type: string, enum: [join, aggregate, calculate, copy, dynamic] }
        formula_count: { type: integer }
    LineageIR:
      type: object
      properties:
        version: { type: integer }
        level: { type: string, enum: [file, sheet, column] }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/LineageNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/LineageEdge" }
        mermaid:
          type: string
          description: Mermaid flowchart source for the same graph
    TranslatedColumn:
      type: object
      required: [table, column, formula, status]
      properties:
        table: { type: string }
        column: { type: string }
        include: { type: boolean, description: false when the column is excluded from migration }
        formula: { type: string, description: original Excel formula (first row) }
        status: { type: string, enum: [ok, partial, unsupported] }
        sql:
          type: object
          additionalProperties: { type: string }
          description: SQL expression per dialect (sqlite, postgres)
        pandas: { type: string }
        notes:
          type: array
          items: { type: string }
          description: TODO notes for unsupported parts
        depends_on:
          type: array
          items: { type: string }
          description: other derived columns (table.column) this one reads
    Translation:
      type: object
      properties:
        version: { type: integer }
        columns:
          type: array
          items: { $ref: "#/components/schemas/TranslatedColumn" }
        views:
          type: object
          additionalProperties: { type: string }
          description: CREATE VIEW script per dialect
        script: { type: string, description: standalone pandas recompute script }
        counts:
          type: object
          additionalProperties: { type: integer }
    Table:
      type: object
      required: [name, source_file, source_sheet, columns]
      properties:
        name: { type: string }
        source_file: { type: string }
        source_sheet: { type: string }
        row_count: { type: integer }
        header_row: { type: integer }
        columns:
          type: array
          items: { $ref: "#/components/schemas/Column" }
    SchemaIR:
      type: object
      required: [version, tables]
      properties:
        version: { type: integer }
        tables:
          type: array
          items: { $ref: "#/components/schemas/Table" }
    TableReport:
      type: object
      properties:
        name: { type: string }
        rows_loaded: { type: integer }
        ok: { type: boolean }
        error: { type: string, nullable: true }
    MigrationReport:
      type: object
      properties:
        target: { type: string }
        tables:
          type: array
          items: { $ref: "#/components/schemas/TableReport" }
        artifacts:
          type: array
          items: { type: string }
        issues:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
    Status:
      type: object
      required: [job_id, state]
      properties:
        job_id: { type: string }
        state: { type: string, enum: [analyzed, migrating, done, failed] }
        created_by: { type: string, nullable: true }
        files:
          type: array
          items: { type: string }
        issues:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
        reports:
          type: array
          items: { $ref: "#/components/schemas/MigrationReport" }
        error: { type: string, nullable: true }
